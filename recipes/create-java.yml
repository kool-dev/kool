title: "Creating Java Application"

actions:
  - recipe: pick-java-version
  - scripts:
      - mkdir -p $CREATE_DIRECTORY
      - docker pull -q gradle:9-jdk$JAVA_VERSION
      - kool docker gradle:9-jdk$JAVA_VERSION bash -c "cd $CREATE_DIRECTORY && gradle init --no-daemon --use-defaults --java-version $JAVA_VERSION --type java-application --dsl kotlin --test-framework junit-jupiter"
