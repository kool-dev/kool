title: "Wizard: Laravel Node"

actions:
  # Defines which Javascript package manager to use
  - prompt: 'Which Javascript package manager do you want to use'
    ref: 'javascript_package_manager'
    default: 'npm'
    options:
      - name: 'npm'
        actions:
          - recipe: npm-laravel
      - name: 'yarn'
        actions:
          - recipe: yarn-laravel
      - name: 'bun'
        actions:
          - recipe: bun-laravel
      - name: 'None'
