title: "Creating Spring Boot Application"

actions:
  - input: 'Group'
    ref: 'SPRING_GROUP'
    default: 'com.example'
  - input: 'Artifact'
    ref: 'SPRING_ARTIFACT'
    default: 'application'
  - input: 'Application name'
    ref: 'SPRING_NAME'
    default: 'Application'
  - api: 'https://start.spring.io/metadata/client'
    prompts:
      - path: 'language'
        prompt: 'Which language do you want to use?'
        ref: 'SPRING_LANGUAGE'
      - path: 'javaVersion'
        prompt: 'Which Java version do you want to use?'
        ref: 'JAVA_VERSION'
      - path: 'dependencies'
        prompt: 'Which Spring dependencies do you want to use?'
        ref: 'SPRING_DEPENDENCIES'
        multiple: true
        compatible: 'bootVersion'
  - recipe: pick-java-version
  - scripts:
      - mkdir -p "$CREATE_DIRECTORY"
      - docker pull -q gradle:9-jdk$JAVA_VERSION
      - kool docker --env CREATE_DIRECTORY --env SPRING_LANGUAGE --env SPRING_GROUP --env SPRING_ARTIFACT --env SPRING_NAME --env JAVA_VERSION --env SPRING_DEPENDENCIES gradle:9-jdk$JAVA_VERSION bash -c "cd \"$(printenv CREATE_DIRECTORY)\" && curl -sSLG --fail-with-body https://start.spring.io/starter.zip --data-urlencode type=gradle-project --data-urlencode \"language=$(printenv SPRING_LANGUAGE)\" --data-urlencode \"groupId=$(printenv SPRING_GROUP)\" --data-urlencode \"artifactId=$(printenv SPRING_ARTIFACT)\" --data-urlencode \"name=$(printenv SPRING_NAME)\" --data-urlencode \"javaVersion=$(printenv JAVA_VERSION)\" --data-urlencode \"dependencies=$(printenv SPRING_DEPENDENCIES)\" -o /tmp/starter.zip || { cat /tmp/starter.zip >&2; echo >&2; exit 1; }; unzip -q /tmp/starter.zip -d ."
