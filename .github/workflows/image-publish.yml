name: Publish tested image digests
on:
  workflow_call:
    inputs:
      canonical-repository:
        type: string
        required: true
      default-branch:
        type: string
        required: true
      repository:
        type: string
        required: true
      tags:
        description: Complete expected stable-tag JSON array
        type: string
        required: true
      architectures:
        type: string
        default: '["amd64","arm64"]'
      architecture-aliases:
        description: Retain Node's x86_64/aarch64 compatibility tags
        type: boolean
        default: false
      tooling-ref:
        description: Exact kool commit, matching the caller's pinned workflow/actions
        type: string
        required: true
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.repository == inputs.canonical-repository &&
      github.ref == format('refs/heads/{0}', inputs.default-branch) &&
      contains(fromJSON('["push","schedule","workflow_dispatch","repository_dispatch"]'), github.event_name)
    runs-on: ubuntu-24.04
    env:
      RELEASE_CANONICAL_REPOSITORY: ${{ inputs.canonical-repository }}
      RELEASE_BRANCH: ${{ inputs.default-branch }}
      RELEASE_REPOSITORY: ${{ inputs.repository }}
      RELEASE_TAGS: ${{ inputs.tags }}
      RELEASE_ARCHES: ${{ inputs.architectures }}
      RELEASE_ARCH_ALIASES: ${{ inputs.architecture-aliases }}
    steps:
      - name: Require immutable tooling
        env:
          TOOLING_REF: ${{ inputs.tooling-ref }}
        run: '[[ "$TOOLING_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          repository: kool-dev/kool
          ref: ${{ inputs.tooling-ref }}
          path: .image-ci
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: images-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: release-metadata
      - name: Validate every tag/platform before login or stable updates
        run: bash .image-ci/.github/actions/image-stage/release.sh validate
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish manifests only
        run: bash .image-ci/.github/actions/image-stage/release.sh publish
